[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Blog posts used to live at the site root
[[redirects]]
  from = "/coffee/*"
  to = "/blog/coffee/"
  status = 301

[[redirects]]
  from = "/deploy-blog/*"
  to = "/blog/deploy-blog/"
  status = 301

[[redirects]]
  from = "/lambda-world-2019/*"
  to = "/blog/lambda-world-2019/"
  status = 301

[[redirects]]
  from = "/tracking/*"
  to = "/blog/tracking/"
  status = 301
